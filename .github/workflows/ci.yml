name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Lint and simulator/API tests (no TensorFlow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      - name: Lint (real errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        run: pytest -m "not tf" -q

  model:
    name: Model tests (TensorFlow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -m tf -q
